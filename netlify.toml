[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# API so'rovlari Render'dagi FastAPI backend'ga yo'naltiriladi
# (Render servis manzili boshqacha bo'lsa, shu yerda almashtiring).
[[redirects]]
  from = "/api/*"
  to = "https://tezaurus-web.onrender.com/api/:splat"
  status = 200
  force = true

# SPA (react-router) fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
